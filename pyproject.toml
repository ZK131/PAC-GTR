[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pac-gtr"
version = "0.2.0"
description = "Code-only implementation of DUTR image refinement and probability-aware multiview 3D crack centerline reconstruction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]
reconstruction = ["networkx>=3.2", "open3d>=0.18", "pc-skeletor", "scikit-learn==1.6.1", "pandas>=2", "tqdm", "numba"]
image = ["torch>=2.0", "opencv-python>=4.8"]
train = ["torch>=2.0", "scikit-image>=0.21"]

[tool.setuptools.packages.find]
include = ["pac_gtr*", "topocracknet*", "crack_reconstruction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
